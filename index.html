<!DOCTYPE html>
<html>
<head>
  <title>Auth + Upload</title>
</head>
<body>

<h2>Username Login</h2>

<input id="username" placeholder="Username"><br><br>
<input id="password" type="password" placeholder="Password"><br><br>

<button onclick="signUp()">Sign Up</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>

<hr>

<h2>Upload Image</h2>

<input type="file" id="fileInput"><br><br>
<button onclick="uploadImage()">Upload</button>

<p id="imageUrl"></p>

<h3>Delete Image</h3>
<input id="deletePath" placeholder="Enter file path">
<button onclick="deleteImage()">Delete</button>

<p id="status">Not logged in</p>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

const SUPABASE_URL = "https://cabbfkdllhxnmgekhfpy.supabase.co";
const SUPABASE_ANON_KEY = "YOUR_KEY";

const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const status = document.getElementById("status");

function fakeEmail(username) {
  return username + "@app.local";
}

// SIGN UP
window.signUp = async () => {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const email = fakeEmail(username);

  const { data, error } = await supabase.auth.signUp({
    email,
    password
  });

  if (!error) {
    // store username
    await supabase.from("profiles").insert({
      id: data.user.id,
      username: username
    });
  }

  status.textContent = error ? error.message : "Signed up!";
};

// LOGIN
window.login = async () => {
  const username = document.getElementById("username").value;
  const password = document.getElementById("password").value;

  const email = fakeEmail(username);

  const { data, error } = await supabase.auth.signInWithPassword({
    email,
    password
  });

  status.textContent = error
    ? error.message
    : "Logged in as " + username;
};

// LOGOUT
window.logout = async () => {
  await supabase.auth.signOut();
  status.textContent = "Logged out";
};

// UPLOAD IMAGE
window.uploadImage = async () => {
  const file = document.getElementById("fileInput").files[0];
  if (!file) return;

  const filePath = `public/${Date.now()}_${file.name}`;

  const { error } = await supabase.storage
    .from("images")
    .upload(filePath, file);

  if (error) {
    status.textContent = error.message;
    return;
  }

  const { data } = supabase.storage
    .from("images")
    .getPublicUrl(filePath);

  document.getElementById("imageUrl").textContent = data.publicUrl;
  status.textContent = "Uploaded!";
};

// DELETE IMAGE
window.deleteImage = async () => {
  const path = document.getElementById("deletePath").value;

  const { error } = await supabase.storage
    .from("images")
    .remove([path]);

  status.textContent = error ? error.message : "Deleted!";
};
</script>

</body>
</html>
